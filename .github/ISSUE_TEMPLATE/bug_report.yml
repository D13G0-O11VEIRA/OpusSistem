name: Relatar um problema
description: Algo não funciona como esperado
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar! **Não cole senhas, dados de clientes ou o arquivo `application.properties` aqui.**
        Apague/anonimize qualquer informação sensível de prints e logs.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra a tela ...
        2. Clique em ...
        3. Veja o erro ...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do OpusSistem
      placeholder: "1.2.0"
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Sistema operacional, versão do JDK e do MySQL.
      placeholder: "Windows 11, JDK 26, MySQL 8.4"
  - type: textarea
    id: log
    attributes:
      label: Mensagem de erro ou log (sem dados sensíveis)
      render: text
