# ---------------------------------------------------------------
# OpusSistem - configuração local
# 1) Copie este arquivo para  config/application.properties
# 2) Preencha usuário e senha do MySQL
# O arquivo application.properties NÃO vai para o Git (.gitignore).
# Também é possível usar variáveis de ambiente: OPUS_DB_HOST, OPUS_DB_PORT,
# OPUS_DB_NAME, OPUS_DB_USER, OPUS_DB_PASSWORD, OPUS_STORAGE_DIR.
# ---------------------------------------------------------------

db.host=localhost
db.port=3306
db.name=opussistem
db.user=opus
db.password=TROQUE_ESTA_SENHA

# Fuso horário do servidor MySQL
db.timezone=America/Fortaleza

# Parâmetros extras da URL JDBC (opcional)
db.params=useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectTimeout=5000

# Pasta onde ficam assinaturas, relatórios em PDF, logo e anexos
storage.dir=storage
